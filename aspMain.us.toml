# RSPRecomp config - WinBack audio microcode (libultra n_audio aspMain).
# Text at ROM 0xD9F30 (vram 0x800FEB30, right after rspboot); data at ROM
# 0xEFF20 (vram 0x80114B20). F3DEX2 2.08 text follows at ROM 0xDAD50 and is
# handled by RT64.
text_offset = 0xD9F30
text_size = 0xE20
text_address = 0x04001080
rom_file_path = "baserom.us.z64"
output_file_path = "rsp/aspMain.cpp"
output_function_name = "aspMain"
# Audio command jump table: halfwords at DMEM 0x10 (ucode data + 0x10).
extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C
]
