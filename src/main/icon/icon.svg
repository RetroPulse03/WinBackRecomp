<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- WinBack Recompiled icon: a laser sight settling on a reticle. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a36"/>
      <stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ff1a0d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff1a0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff4a3a" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="47.5" fill="none" stroke="#3a4a5c" stroke-width="3"/>
  <!-- reticle -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="#c9d4df" stroke-width="12"/>
  <g stroke="#c9d4df" stroke-width="12" stroke-linecap="round">
    <line x1="128" y1="36" x2="128" y2="76"/>
    <line x1="128" y1="180" x2="128" y2="220"/>
    <line x1="36" y1="128" x2="76" y2="128"/>
    <line x1="180" y1="128" x2="220" y2="128"/>
  </g>
  <!-- laser beam from the lower left -->
  <line x1="24" y1="232" x2="122" y2="134" stroke="url(#beam)" stroke-width="7" stroke-linecap="round"/>
  <!-- dot -->
  <circle cx="128" cy="128" r="44" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="15" fill="#ff3b30"/>
  <circle cx="124" cy="124" r="5" fill="#ffd0cc"/>
</svg>
