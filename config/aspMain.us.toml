# RSPRecomp config - WinBack audio microcode (the one libmus uses).
# Audio tasks carry ucode 0x800FF950 (ROM 0xDAD50, 0xC60 bytes) and
# ucode_data 0x80114DE0 (ROM 0xF01E0). F3DEX2 2.08 text follows at ROM
# 0xDB9B0 and goes to RT64. (Another audio ucode sits at ROM 0xD9F30 with
# data at 0xEFF20; the game never runs it.)
text_offset = 0xDAD50
text_size = 0xC60
text_address = 0x04001080
rom_file_path = "../rom/baserom.us.z64"
output_file_path = "../generated/rsp/aspMain.cpp"
output_function_name = "aspMain"
# Command jump table: halfwords at DMEM 0x0 (ucode data + 0). The RSP PC is
# 12 bits, so entry 14 (0x02B0) is IMEM 0x12B0; entries 7 and 8 are 0
# (unused commands).
extra_indirect_branch_targets = [
    0x10EC, 0x139C, 0x119C, 0x1A64, 0x11C8, 0x17EC, 0x1208,
    0x127C, 0x1348, 0x1248, 0x1C84, 0x12D4, 0x12B0, 0x1384
]
