# N64Recomp configuration - WinBack: Covert Operations (USA)
# Paths are relative to this file. tools/regen.sh runs it.

[input]
entrypoint = 0x80025C00
# Generated from the splat output by tools/gen_recomp_syms.py.
symbols_file_path = "../generated/winback.us.syms.toml"
rom_file_path = "../rom/baserom.us.z64"
output_func_path = "../generated/RecompiledFuncs"
functions_per_output_file = 200
# Debug only: calls TRACE_ENTRY() (src/game/trace.h) at every function entry so
# WINBACK_DEBUG can print each thread's recent calls. Costs performance; off in releases.
trace_mode = false

[patches]
# Functions that touch hardware the runtime emulates at a higher level.
stubs = [
]

# Replaced by hand-written versions in src/game/patches.c.
ignored = [
    # Idle thread busy loop.
    "func_800E3D88",
    # Busy-waits on the pending graphics task counter.
    "func_800ECC20",
    # Jump table walked by pointer, which N64Recomp can't resolve.
    "func_800CE0D4",
]

# --- Audio -----------------------------------------------------------------

# libmus audio thread (func_800E8B28) wakes every VI and skips the frame while
# osAiGetStatus reports the AI FIFO full; that is what holds it to the output
# rate (552 samples per update at 22050 Hz is 40 updates/s). The runtime's
# osAiGetStatus always returns 0, so report a full FIFO once enough audio is
# queued. Runs right after the osAiGetStatus call, before $v0 is copied to $s0.
[[patches.hook]]
func = "func_800E8B28"
before_vram = 0x800E8B90
text = "{ extern uint32_t winback_ai_get_status(void); ctx->r2 = winback_ai_get_status(); }"

# --- Input -----------------------------------------------------------------

# Right stick click: snap the camera behind the player. The game does this when
# C-Left/C-Right is pressed twice within 5 frames, by setting flag 0x200 in the
# camera's flags (camera+0x132) unless it is already set or the player's
# +0x16EC is 1. Request it the same way, under the same conditions, right after
# the game's own check ($a2 = camera, $t0 = player, camera+0x18 = controller).
[[patches.hook]]
func = "func_80035970"
before_vram = 0x80035D70
text = "{ extern int winback_take_rear_snap(int); if (winback_take_rear_snap(MEM_H(0x18, ctx->r6)) && !(MEM_HU(0x132, ctx->r6) & 0x200) && MEM_H(0x16EC, ctx->r8) != 1) { MEM_H(0x132, ctx->r6) = MEM_HU(0x132, ctx->r6) | 0x200; } }"

# Right stick X: analog camera turning (winback_camera_analog in
# src/game/patches.c). When it has turned the camera, skip the game's button
# turning and the speed's fall to zero, to 0x80035D00 ($a3 = 0 there).
[[patches.hook]]
func = "func_80035970"
before_vram = 0x80035B0C
text = "{ extern int winback_camera_analog(uint8_t*, recomp_context*); if (winback_camera_analog(rdram, ctx)) { ctx->r7 = 0; goto L_80035D00; } }"

# --- Busy-wait loops -------------------------------------------------------
# The runtime only switches game threads at OS calls, so loops that poll
# memory set by another thread get a yield at their head.

# Main loop: while (D_80187FB8 == state); waits for the frame callback
# (func_8004BA40) to change the game state.
[[patches.hook]]
func = "func_80025D94"
before_vram = 0x80025EE0
text = "{ extern void yield_self_1ms(uint8_t*); yield_self_1ms(rdram); }"

# --- Level Select (src/game/level_select.cpp) ------------------------------

# Front end and gameplay frame callbacks: jumps requested from the menu run here.
[[patches.hook]]
func = "func_80073600"
before_vram = 0x80073600
text = "{ extern void winback_level_frame(uint8_t*, recomp_context*, int); winback_level_frame(rdram, ctx, 0); }"

[[patches.hook]]
func = "func_8004BA40"
before_vram = 0x8004BA40
text = "{ extern void winback_level_frame(uint8_t*, recomp_context*, int); winback_level_frame(rdram, ctx, 1); }"

# Stage init, where it chooses the player's spawn.
[[patches.hook]]
func = "func_8004C108"
before_vram = 0x8004C108
text = "{ extern void winback_level_spawn(uint8_t*); winback_level_spawn(rdram); }"

# Stage init, right after the stage start snapshot (func_8009C8E0).
[[patches.hook]]
func = "func_8004BD7C"
before_vram = 0x8004C070
text = "{ extern void winback_stage_snapshot(uint8_t*); winback_stage_snapshot(rdram); }"

# Script checkpoint command, right after it saves the snapshot.
[[patches.hook]]
func = "func_8009AA9C"
before_vram = 0x8009BB08
text = "{ extern void winback_checkpoint_reached(void); winback_checkpoint_reached(); }"
